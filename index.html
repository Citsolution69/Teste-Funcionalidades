<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pergunta Importante 💋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff6b9d, #ff8cc8, #ffb3d9, #ff6b9d);
    background-size: 400% 400%;
    animation: bgShift 5s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .heart-float {
    position: absolute;
    bottom: -60px;
    animation: floatUp linear infinite;
    opacity: 0.5;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.5; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 36px;
    padding: 52px 48px 48px;
    width: 90%;
    max-width: 460px;
    text-align: center;
    box-shadow:
      0 24px 64px rgba(255, 80, 140, 0.35),
      0 0 0 3px rgba(255, 107, 157, 0.25);
    animation: cardIn 0.7s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes cardIn {
    0%   { transform: scale(0.5) rotate(-6deg); opacity: 0; }
    65%  { transform: scale(1.05) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .emoji-main {
    font-size: 90px;
    display: block;
    margin: 0 auto 10px;
    filter:
      drop-shadow(4px 8px 6px rgba(0,0,0,0.28))
      drop-shadow(-2px -2px 4px rgba(255,255,255,0.6));
    animation: wobbleMain 2.5s ease-in-out infinite;
    user-select: none;
  }
  @keyframes wobbleMain {
    0%, 100% { transform: rotate(-6deg) scale(1) translateY(0); }
    30%       { transform: rotate(6deg) scale(1.08) translateY(-8px); }
    60%       { transform: rotate(-3deg) scale(1.04) translateY(-4px); }
  }

  .emoji-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .emoji-sm {
    font-size: 44px;
    filter:
      drop-shadow(3px 6px 4px rgba(0,0,0,0.25))
      drop-shadow(-1px -1px 3px rgba(255,255,255,0.55));
    animation: wobbleSm 2.2s ease-in-out infinite;
    user-select: none;
  }
  .emoji-sm:nth-child(2) { animation-delay: 0.35s; }
  .emoji-sm:nth-child(3) { animation-delay: 0.7s; }
  @keyframes wobbleSm {
    0%, 100% { transform: rotate(-8deg) scale(1) translateY(0); }
    50%       { transform: rotate(8deg) scale(1.14) translateY(-7px); }
  }

  .title {
    font-size: 24px;
    font-weight: 800;
    color: #b5135a;
    line-height: 1.35;
    margin-bottom: 8px;
    text-shadow: 1px 1px 0 #ffb3d9;
  }
  .subtitle {
    font-size: 14px;
    color: #d0608a;
    font-style: italic;
    margin-bottom: 36px;
  }

  .btn-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    min-height: 60px; /* Garante que o card não mude de tamanho drasticamente */
  }

  .btn {
    padding: 15px 38px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff3d87, #ff80bb);
    color: white;
    box-shadow: 0 6px 20px rgba(255,61,135,0.45), 0 3px 0 #b5135a;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-yes:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 12px 30px rgba(255,61,135,0.55), 0 3px 0 #b5135a;
  }
  .btn-yes:active { transform: scale(0.97); }

  /* NO button */
  .btn-no {
    padding: 15px 38px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #aaa, #ccc);
    color: white;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18), 0 3px 0 #888;
    letter-spacing: 0.3px;
    transition: transform 0.08s;
  }

  .btn-no.fleeing {
    position: fixed;
    z-index: 9999;
    pointer-events: auto;
  }

  /* panic shake when idle */
  @keyframes panicShake {
    0%,100% { transform: translateX(0) rotate(0deg); }
    15%      { transform: translateX(-4px) rotate(-2deg); }
    30%      { transform: translateX(4px) rotate(2deg); }
    45%      { transform: translateX(-3px) rotate(-1.5deg); }
    60%      { transform: translateX(3px) rotate(1.5deg); }
    75%      { transform: translateX(-2px) rotate(-1deg); }
    90%      { transform: translateX(2px) rotate(1deg); }
  }
  .btn-no.shaking { animation: panicShake 0.5s ease infinite; }

  /* sweat drops */
  .sweat {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    font-size: 22px;
    animation: sweatFall 0.9s ease-out forwards;
    user-select: none;
  }
  @keyframes sweatFall {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(40px) scale(0.5); }
  }

  /* counter badge */
  .flee-badge {
    position: fixed;
    z-index: 9998;
    background: #ff3d87;
    color: white;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: opacity 0.3s;
  }

  /* SUCCESS PAGE */
  .success-page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: linear-gradient(135deg, #ff3d87, #ff80bb, #ffb3d9);
    background-size: 300% 300%;
    animation: bgShift 2s ease infinite;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px;
  }
  .success-page.active { display: flex; }

  .success-emoji-big {
    font-size: 110px;
    filter:
      drop-shadow(6px 12px 10px rgba(0,0,0,0.3))
      drop-shadow(-3px -3px 6px rgba(255,255,255,0.55));
    animation: spinIn 1s cubic-bezier(.36,.07,.19,.97) both, floatBig 2.5s ease-in-out 1s infinite;
    margin-bottom: 20px;
    user-select: none;
  }
  @keyframes spinIn {
    0%   { transform: scale(0) rotate(-180deg); }
    65%  { transform: scale(1.3) rotate(12deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes floatBig {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%       { transform: translateY(-18px) rotate(3deg); }
  }

  .laugh-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .laugh-e {
    font-size: 52px;
    filter:
      drop-shadow(3px 6px 4px rgba(0,0,0,0.28))
      drop-shadow(-2px -2px 3px rgba(255,255,255,0.5));
    animation: laughBounce 0.75s ease-in-out infinite alternate;
    user-select: none;
  }
  .laugh-e:nth-child(1) { animation-delay: 0s; }
  .laugh-e:nth-child(2) { animation-delay: 0.15s; }
  .laugh-e:nth-child(3) { animation-delay: 0.3s; }
  .laugh-e:nth-child(4) { animation-delay: 0.45s; }
  .laugh-e:nth-child(5) { animation-delay: 0.6s; }
  @keyframes laughBounce {
    0%   { transform: scale(1) translateY(0); }
    100% { transform: scale(1.2) translateY(-14px); }
  }

  .success-title {
    font-size: 34px;
    font-weight: 900;
    color: white;
    text-shadow: 2px 2px 0 rgba(160,0,70,0.4), 4px 4px 0 rgba(160,0,70,0.15);
    margin-bottom: 12px;
    line-height: 1.3;
    animation: fadeUp 0.8s 0.7s both;
  }
  .success-sub {
    font-size: 18px;
    color: rgba(255,255,255,0.92);
    margin-bottom: 32px;
    animation: fadeUp 0.8s 1s both;
  }
  .bottom-emojis {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.8s 1.3s both;
  }
  .bottom-emojis span {
    font-size: 52px;
    filter: drop-shadow(4px 8px 5px rgba(0,0,0,0.28));
    user-select: none;
  }
  .bottom-emojis span:nth-child(1) { animation: laughBounce 0.7s 0.0s ease-in-out infinite alternate; }
  .bottom-emojis span:nth-child(2) { animation: laughBounce 0.7s 0.2s ease-in-out infinite alternate; }
  .bottom-emojis span:nth-child(3) { animation: laughBounce 0.7s 0.4s ease-in-out infinite alternate; }
  .bottom-emojis span:nth-child(4) { animation: laughBounce 0.7s 0.6s ease-in-out infinite alternate; }
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(28px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1001;
    overflow: hidden;
  }
  .conf {
    position: absolute;
    border-radius: 2px;
    animation: confFall linear forwards;
  }
  @keyframes confFall {
    0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(760deg); opacity: 0.2; }
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsWrap"></div>

<div class="card" id="mainCard">
  <span class="emoji-main">😘</span>
  <div class="emoji-row">
    <span class="emoji-sm">💋</span>
    <span class="emoji-sm">❤️</span>
    <span class="emoji-sm">🫦</span>
  </div>
  <div class="title">Neusa Tales,<br>posso dar-te um beijo linguado? 👅</div>
  <div class="subtitle">Uma pergunta muito séria que merece resposta 🥺</div>
  <div class="btn-row" id="btnRow">
    <button class="btn btn-yes" id="btnYes" onclick="handleYes()">😍 SIM, pode!</button>
    <button class="btn btn-no" id="btnNo">🙅 Não</button>
  </div>
</div>

<div class="success-page" id="successPage">
  <div class="confetti-wrap" id="confWrap"></div>
  <span class="success-emoji-big">😂</span>
  <div class="laugh-row">
    <span class="laugh-e">🤣</span>
    <span class="laugh-e">😂</span>
    <span class="laugh-e">🤣</span>
    <span class="laugh-e">😂</span>
    <span class="laugh-e">🤣</span>
  </div>
  <div class="success-title">...e vou pegar o rabo também! 🍑</div>
  <div class="success-sub">Sabias que ia ser assim! 😏💋</div>
  <div class="bottom-emojis">
    <span>😜</span><span>💋</span><span>🍑</span><span>😂</span>
  </div>
</div>

<script>
  /* ── FLOATING HEARTS ── */
  const heartsWrap = document.getElementById('heartsWrap');
  const heartList = ['❤️','💕','💗','💓','💖','💝','💞','🩷'];
  function spawnHeart() {
    const el = document.createElement('div');
    el.className = 'heart-float';
    el.textContent = heartList[Math.floor(Math.random() * heartList.length)];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.fontSize = (14 + Math.random() * 22) + 'px';
    const dur = 5 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * 2) + 's';
    heartsWrap.appendChild(el);
    setTimeout(() => el.remove(), (dur + 3) * 1000);
  }
  for (let i = 0; i < 10; i++) spawnHeart();
  setInterval(spawnHeart, 600);

  /* ── NO BUTTON ── */
  const btnNo = document.getElementById('btnNo');

  const noTexts = [
    '🙅 Não',
    '😰 Para Neu!',
    '🏃 Não me apanhas!',
    '😱 Aiiii!',
    '🫣 Quase!',
    '😤 Nunca!',
    '🙈 Vem-cá!',
    '💨 Whoosh!',
    '😵 Tontinha!',
    '🥵 Nezildaaa!',
  ];

  let noX = 0, noY = 0;
  let fleeing = false;
  let fleeCount = 0;
  let baseSize = 18; 
  let shakeTimer = null;
  let badge = null;

  function initNoButton() {
    // Captura a posição real na tela antes de mudar para fixed
    const rect = btnNo.getBoundingClientRect();
    noX = rect.left;
    noY = rect.top;

    // Define largura e altura fixas para não colapsar
    btnNo.style.width  = rect.width + 'px';
    btnNo.style.height = rect.height + 'px';
    
    // MOVE PARA O BODY para evitar problemas com transform no pai
    document.body.appendChild(btnNo);

    btnNo.classList.add('fleeing');
    btnNo.style.left   = noX + 'px';
    btnNo.style.top    = noY + 'px';
    btnNo.style.transition = 'none';

    // badge de contagem
    badge = document.createElement('div');
    badge.className = 'flee-badge';
    badge.style.opacity = '0';
    badge.style.left = (noX + rect.width - 8) + 'px';
    badge.style.top  = (noY - 8) + 'px';
    document.body.appendChild(badge);

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    startShakeTimer();
  }

  // Espera a animação do card terminar para pegar a posição correta
  setTimeout(initNoButton, 800);

  function startShakeTimer() {
    clearTimeout(shakeTimer);
    shakeTimer = setTimeout(() => {
      btnNo.classList.add('shaking');
    }, 1200);
  }

  function onMouseMove(e) {
    checkProximity(e.clientX, e.clientY);
  }
  function onTouchMove(e) {
    const t = e.touches[0];
    checkProximity(t.clientX, t.clientY);
  }

  function checkProximity(mx, my) {
    const bw = btnNo.offsetWidth;
    const bh = btnNo.offsetHeight;
    const cx = noX + bw / 2;
    const cy = noY + bh / 2;
    const dx = mx - cx;
    const dy = my - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const threshold = 120 + fleeCount * 10;
    if (dist < threshold && !fleeing) {
      triggerFlee(mx, my);
    }
  }

  function triggerFlee(mx, my) {
    fleeing = true;
    fleeCount++;
    btnNo.classList.remove('shaking');

    const bw = btnNo.offsetWidth;
    const bh = btnNo.offsetHeight;
    const cx = noX + bw / 2;
    const cy = noY + bh / 2;

    const dx = cx - mx;
    const dy = cy - my;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    // Reduz tamanho gradualmente
    const shrink = Math.max(0.6, 1 - fleeCount * 0.03);
    baseSize = Math.max(12, 18 * shrink);
    btnNo.style.fontSize = baseSize + 'px';
    btnNo.style.padding  = Math.max(8, 15 * shrink) + 'px ' + Math.max(18, 38 * shrink) + 'px';

    // Texto muda sequencialmente
    btnNo.textContent = noTexts[Math.min(fleeCount, noTexts.length - 1)];

    // Atualiza badge
    badge.textContent = fleeCount;
    badge.style.opacity = '1';

    // Calcula nova posição fugindo do mouse
    const speed = 200 + fleeCount * 20 + Math.random() * 100;
    let angle = Math.atan2(dy, dx);
    angle += (Math.random() - 0.5) * 1; // Pequeno desvio aleatório

    let nx = noX + Math.cos(angle) * speed;
    let ny = noY + Math.sin(angle) * speed;

    // Mantém dentro da tela
    const margin = 20;
    nx = Math.max(margin, Math.min(window.innerWidth  - bw - margin, nx));
    ny = Math.max(margin, Math.min(window.innerHeight - bh - margin, ny));

    spawnSweat(noX + bw / 2, noY);

    const transTime = Math.max(0.2, 0.4 - fleeCount * 0.01);
    btnNo.style.transition = `left ${transTime}s cubic-bezier(0.25,0.46,0.45,0.94), top ${transTime}s cubic-bezier(0.25,0.46,0.45,0.94)`;

    noX = nx;
    noY = ny;
    btnNo.style.left = nx + 'px';
    btnNo.style.top  = ny + 'px';

    badge.style.transition = `left ${transTime}s, top ${transTime}s`;
    badge.style.left = (nx + bw - 8) + 'px';
    badge.style.top  = (ny - 8) + 'px';

    setTimeout(() => {
      fleeing = false;
      startShakeTimer();
    }, transTime * 1000 + 50);

    if (navigator.vibrate) navigator.vibrate(40);
  }

  function spawnSweat(x, y) {
    const drops = ['💦','😰','💧'];
    const count = Math.min(3, 1 + Math.floor(fleeCount / 3));
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sweat';
      s.textContent = drops[Math.floor(Math.random() * drops.length)];
      s.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
      s.style.top  = (y + Math.random() * 20) + 'px';
      s.style.animationDelay = (i * 0.1) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }

  function handleYes() {
    document.getElementById('mainCard').style.display = 'none';
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('touchmove', onTouchMove);
    if (badge) badge.remove();
    if (btnNo) btnNo.remove();
    const sp = document.getElementById('successPage');
    sp.classList.add('active');
    launchConfetti();
    setInterval(launchConfetti, 2800);
  }

  const confColors = ['#ff4d94','#ffb3d9','#ffffff','#ffd700','#ff6347','#ff85c0','#c0f'];
  function launchConfetti() {
    const wrap = document.getElementById('confWrap');
    for (let i = 0; i < 100; i++) {
      const c = document.createElement('div');
      c.className = 'conf';
      c.style.left       = (Math.random() * 100) + 'vw';
      c.style.top        = '-20px';
      c.style.width      = (6 + Math.random() * 8) + 'px';
      c.style.height     = (6 + Math.random() * 8) + 'px';
      c.style.background = confColors[Math.floor(Math.random() * confColors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      const dur = 2 + Math.random() * 3;
      c.style.animationDuration = dur + 's';
      c.style.animationDelay   = (Math.random() * 1.5) + 's';
      wrap.appendChild(c);
      setTimeout(() => c.remove(), (dur + 2) * 1000);
    }
  }
</script>
</body>
</html>
